name: Package and publish release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build portable binaries
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=
            if [ "$os" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/artifactory-mcp-${os}-${arch}${suffix}" ./cmd/artifactory-mcp
          done
          docker build --build-arg VERSION="$VERSION" -t artifactory-mcp:"$VERSION" .
          docker save artifactory-mcp:"$VERSION" | gzip > dist/artifactory-mcp-container.tar.gz
          cd dist
          sha256sum artifactory-mcp-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: artifactory-mcp-release
          path: dist/
      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
  docker:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image tags
        id: image
        env:
          STABLE_RELEASE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        run: |
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "The release tag must be a valid Docker image tag (at most 128 characters)." >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "docker.io/bas2k/artifactory-mcp:$VERSION"
            echo "ghcr.io/bas2k/artifactory-mcp:$VERSION"
            if [ "$STABLE_RELEASE" = true ]; then
              echo "docker.io/bas2k/artifactory-mcp:latest"
              echo "ghcr.io/bas2k/artifactory-mcp:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push multiarch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
